# Render Blueprint: Background Worker (long polling).
# Значения переменных вводятся в панели Render, в репозиторий их не кладём.
services:
  - type: worker
    name: music-finder-bot
    runtime: docker
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
